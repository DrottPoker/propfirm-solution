name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore PropfirmSolution.slnx

      - name: Check formatting
        run: dotnet format PropfirmSolution.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PropfirmSolution.slnx --configuration Release --no-restore

      # The build regenerates the OpenAPI document. A diff means it was not committed after an API change.
      - name: Check that the OpenAPI document is up to date
        run: git diff --exit-code -- trading/terminal/openapi

      - name: Test
        run: dotnet test --solution PropfirmSolution.slnx --configuration Release --no-build

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check that the API types are up to date
        run: |
          pnpm generate:api
          git diff --exit-code -- trading/terminal/src/lib/api/schema.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker compose
        run: docker compose -f deploy/docker-compose.yml config --quiet

  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Start Postgres
        run: docker compose -f deploy/docker-compose.yml up -d --wait postgres

      - name: Build the trading service
        run: dotnet build trading/src/Trading.Service --configuration Release

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @trading/terminal exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm --filter @trading/terminal e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            trading/terminal/playwright-report
            trading/terminal/test-results
